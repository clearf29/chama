<!DOCTYPE html>
<html>
<head>
  <title>Chama Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
  </style>
</head>
<body>

<script>
  function generateRandomNumber() {
    return Math.floor(Math.random() * 10) + 1;
  }

  document.body.innerText = generateRandomNumber();
</script>

</body>
</html>
